version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      go-modules:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        update-types: ["minor", "patch"]
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
  - package-ecosystem: "docker"
    directory: "/docs/release"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
